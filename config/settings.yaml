data:
  n_records: 500000
  seed: 42

features:
  zscore_threshold: 3.5
  heavy_ip_percentile: 0.99
  admin_recon_threshold: 5000

models:
  isolation_forest:
    n_estimators: 200
    contamination: 0.025
    bootstrap: true
    random_state: 42
  lof:
    n_neighbors: 20
    contamination: 0.025
  ensemble:
    min_votes: 2
    lift_threshold: 3.0

spark:
  local_memory: "4g"
  shuffle_partitions_local: 8
  shuffle_partitions_cluster: 200

api:
  port: 8000
  log_predictions: true

alerting:
  max_alerts: 100
  critical_ip_error_threshold: 0.50
  critical_request_threshold: 5000

lstm:
  seq_len: 10
  hidden_dim: 64
  n_layers: 2
  dropout: 0.2
  batch_size: 256
  max_epochs: 30
  lr: 0.001
  patience: 5
  anomaly_percentile: 97.5

dashboard:
  port: 8050
  refresh_interval_ms: 60000
